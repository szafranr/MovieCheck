[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moviecheck"
version = "0.1.0"
description = "Katalog filmów z raportem HTML — Windows i macOS"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "Jinja2>=3.1.6,<4"]

[project.gui-scripts]
moviecheck = "moviecheck.app:main"

[tool.setuptools.packages.find]
include = ["moviecheck*"]

[tool.setuptools.package-data]
moviecheck = ["templates/*.html"]
